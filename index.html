<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sekolah + QR + Scan Kehadiran & Selesai</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #f2f2f2;
      margin: 0;
      padding: 20px 15px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    /* Navigasi halaman */
    .nav {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .nav button {
      flex: 1;
      min-width: 100px;
      padding: 12px 8px;
      border: none;
      border-radius: 8px;
      background-color: #ddd;
      color: #333;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .nav button.active {
      background-color: #4CAF50;
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
    }

    .nav button:hover:not(.active) {
      background-color: #ccc;
    }

    /* Halaman */
    .page { display: none; }
    .page.active { display: block; animation: pageFadeIn 0.4s ease; }

    @keyframes pageFadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      background-color: #fff;
      padding: 25px 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
      position: relative;
    }

    h2 {
      text-align: center;
      color: #333;
      margin-top: 0;
      margin-bottom: 20px;
    }

    h3 {
      color: #333;
      border-bottom: 2px solid #4CAF50;
      padding-bottom: 8px;
      margin-top: 0;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #444;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    textarea { resize: vertical; height: 80px; }

    .btn-group { display: flex; gap: 10px; }

    button.main-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      color: white;
      transition: 0.3s;
    }

    .btn-submit { background-color: #4CAF50; }
    .btn-submit:hover { background-color: #45a049; }

    .btn-cancel { background-color: #999; display: none; }
    .btn-cancel:hover { background-color: #777; }

    /* Item daftar sekolah */
    .sekolah-item {
      display: flex;
      gap: 15px;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding: 12px 0;
    }

    .sekolah-item:last-child { border-bottom: none; }

    .sekolah-info { flex: 1; }
    .sekolah-info p { margin: 4px 0; color: #555; font-size: 14px; word-break: break-word; }
    .sekolah-info strong { color: #4CAF50; }

    .qr-box {
      background: #fff;
      padding: 5px;
      border: 1px solid #eee;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .aksi {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .aksi button {
      padding: 6px 10px;
      font-size: 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: white;
    }

    .btn-edit { background-color: #2196F3; }
    .btn-edit:hover { background-color: #1976D2; }
    .btn-hapus { background-color: #f44336; }
    .btn-hapus:hover { background-color: #d32f2f; }

    .empty {
      color: #999;
      font-style: italic;
      text-align: center;
      padding: 10px 0;
    }

    /* Halaman scan */
    .reader-wrap {
      width: 100%;
      min-height: 260px;
      background-color: #000;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 15px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #readerHadir, #readerSelesai { width: 100%; }

    #readerHadir video, #readerSelesai video {
      width: 100% !important;
      border-radius: 8px;
    }

    .scan-hint {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .loading-text {
      color: #fff;
      font-size: 14px;
      text-align: center;
      padding: 20px;
    }

    .error-kamera {
      background-color: #fff3cd;
      color: #856404;
      padding: 15px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 15px;
      border: 1px solid #ffeeba;
      display: none;
    }
    .error-kamera.show { display: block; }

    /* ============================= */
    /* OVERLAY HASIL SCAN — SUPER ANIMASI */
    /* ============================= */
    .hasil-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
      animation: overlayFade 0.4s ease;
    }

    .hasil-overlay.show { display: flex; }

    @keyframes overlayFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Background berbeda per tipe */
    .hasil-overlay.hadir {
      background: radial-gradient(circle at center, #66bb6a 0%, #1b5e20 100%);
    }

    .hasil-overlay.selesai {
      background: radial-gradient(circle at center, #42a5f5 0%, #0d47a1 100%);
    }

    .hasil-overlay.tidak-dikenal {
      background: radial-gradient(circle at center, #ef5350 0%, #7f0000 100%);
    }

    /* Confetti canvas */
    #confettiCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Kartu isi hasil */
    .hasil-card {
      position: relative;
      z-index: 2;
      max-width: 520px;
      width: 100%;
      background-color: rgba(255, 255, 255, 0.97);
      border-radius: 24px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
      animation: cardPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes cardPop {
      0% { transform: scale(0.4) rotate(-8deg); opacity: 0; }
      60% { transform: scale(1.08) rotate(2deg); opacity: 1; }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }

    /* Badge ikon berdenyut */
    .status-badge {
      width: 110px;
      height: 110px;
      margin: 0 auto 15px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      color: white;
      position: relative;
      animation: badgePulse 1.6s ease-in-out infinite;
    }

    .hadir .status-badge { background: linear-gradient(135deg, #66bb6a, #2e7d32); }
    .selesai .status-badge { background: linear-gradient(135deg, #42a5f5, #1565c0); }
    .tidak-dikenal .status-badge { background: linear-gradient(135deg, #ef5350, #b71c1c); }

    .status-badge::before,
    .status-badge::after {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 3px solid currentColor;
      opacity: 0.5;
      animation: ringPulse 2s ease-out infinite;
    }
    .status-badge::after { animation-delay: 1s; }

    @keyframes ringPulse {
      0% { transform: scale(0.8); opacity: 0.7; }
      100% { transform: scale(1.7); opacity: 0; }
    }

    @keyframes badgePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    /* Teks utama HADIR / SELESAI */
    .status-text {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: 4px;
      margin: 10px 0 20px;
      background: linear-gradient(90deg, currentColor 0%, #fff 50%, currentColor 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 2.5s linear infinite, textZoom 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
    }

    .hadir .status-text { color: #2e7d32; }
    .selesai .status-text { color: #1565c0; }
    .tidak-dikenal .status-text { color: #c62828; font-size: 34px; }

    @keyframes shine {
      to { background-position: -200% center; }
    }

    @keyframes textZoom {
      0% { transform: scale(0.3); opacity: 0; }
      70% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Baris teks animasi */
    .anim-line {
      opacity: 0;
      animation: slideUp 0.7s ease forwards;
    }

    .line-1 { animation-delay: 0.6s; }
    .line-2 { animation-delay: 1.0s; }
    .line-3 { animation-delay: 1.4s; }
    .line-4 { animation-delay: 1.8s; }
    .line-5 { animation-delay: 2.2s; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hasil-card .sekolah-nama {
      font-size: 22px;
      font-weight: 800;
      color: #1b5e20;
      margin: 8px 0;
    }
    .selesai .hasil-card .sekolah-nama { color: #0d47a1; }

    .hasil-card .sekolah-alamat {
      font-size: 15px;
      color: #666;
      margin: 4px 0 18px;
    }

    .hasil-card .sambutan {
      font-size: 20px;
      font-weight: 700;
      color: #333;
      margin: 14px 0 8px;
      line-height: 1.4;
    }

    .hasil-card .sambutan .highlight {
      display: inline-block;
      background: linear-gradient(120deg, #ffd54f, #ffb300);
      color: #4e342e;
      padding: 2px 12px;
      border-radius: 8px;
      animation: wiggle 2s ease-in-out infinite;
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(-1.5deg); }
      50% { transform: rotate(1.5deg); }
    }

    .hasil-card .pesan {
      font-size: 16px;
      color: #555;
      margin-top: 14px;
      font-style: italic;
      line-height: 1.5;
    }

    .hasil-card .timestamp {
      font-size: 12px;
      color: #999;
      margin-top: 18px;
      letter-spacing: 1px;
    }

    .btn-scan-ulang {
      margin-top: 22px;
      padding: 14px 28px;
      background: linear-gradient(135deg, #4CAF50, #2e7d32);
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s, box-shadow 0.2s;
      opacity: 0;
      animation: slideUp 0.7s ease 2.6s forwards;
    }

    .btn-scan-ulang:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.3);
    }

    .btn-scan-ulang:active {
      transform: translateY(0) scale(0.98);
    }

    .selesai .btn-scan-ulang {
      background: linear-gradient(135deg, #42a5f5, #1565c0);
    }

    .tidak-dikenal .btn-scan-ulang {
      background: linear-gradient(135deg, #ef5350, #b71c1c);
    }

    /* Emoji besar */
    .emoji-row {
      font-size: 28px;
      margin-top: 10px;
      letter-spacing: 6px;
    }

    .emoji-row span {
      display: inline-block;
      animation: bounceEmoji 1.2s infinite;
    }
    .emoji-row span:nth-child(2) { animation-delay: 0.15s; }
    .emoji-row span:nth-child(3) { animation-delay: 0.3s; }
    .emoji-row span:nth-child(4) { animation-delay: 0.45s; }
    .emoji-row span:nth-child(5) { animation-delay: 0.6s; }

    @keyframes bounceEmoji {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @media (max-width: 480px) {
      .status-text { font-size: 38px; }
      .hasil-card { padding: 28px 20px; border-radius: 18px; }
      .status-badge { width: 90px; height: 90px; font-size: 48px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- NAVIGASI -->
    <div class="nav">
      <button id="navDaftar" class="active" onclick="showPage('daftar')">📋 Data</button>
      <button id="navHadir" onclick="showPage('hadir')">📷 Kehadiran</button>
      <button id="navSelesai" onclick="showPage('selesai')">✅ Selesai</button>
    </div>

    <!-- ============ HALAMAN DAFTAR ============ -->
    <div id="pageDaftar" class="page active">
      <div class="card">
        <h2 id="formTitle">Form Pendaftaran Sekolah</h2>
        <form id="formSekolah">
          <label for="nama">Nama Sekolah</label>
          <input type="text" id="nama" placeholder="Masukkan nama sekolah" required>

          <label for="alamat">Alamat</label>
          <textarea id="alamat" placeholder="Masukkan alamat sekolah" required></textarea>

          <label for="kodeqr">Kode QR</label>
          <input type="text" id="kodeqr" placeholder="Masukkan kode unik (contoh: SCH001)" required>

          <div class="btn-group">
            <button type="submit" class="main-btn btn-submit" id="btnSubmit">Tambah ke Daftar</button>
            <button type="button" class="main-btn btn-cancel" id="btnCancel">Batal</button>
          </div>
        </form>
      </div>

      <div class="card">
        <h3>Daftar Sekolah</h3>
        <div id="daftarSekolah">
          <p class="empty">Belum ada data sekolah.</p>
        </div>
      </div>
    </div>

    <!-- ============ HALAMAN SCAN KEHADIRAN ============ -->
    <div id="pageHadir" class="page">
      <div class="card">
        <h2>Scan Kehadiran</h2>
        <p class="scan-hint">Arahkan kamera ke kode QR sekolah untuk mencatat kehadiran</p>

        <div class="error-kamera" id="errorHadir"></div>

        <div class="reader-wrap">
          <div id="readerHadir">
            <div class="loading-text">Memuat kamera...</div>
          </div>
        </div>
      </div>
    </div>

    <!-- ============ HALAMAN SCAN SELESAI ============ -->
    <div id="pageSelesai" class="page">
      <div class="card">
        <h2>Scan Selesai</h2>
        <p class="scan-hint">Arahkan kamera ke kode QR sekolah untuk menandai selesai</p>

        <div class="error-kamera" id="errorSelesai"></div>

        <div class="reader-wrap">
          <div id="readerSelesai">
            <div class="loading-text">Memuat kamera...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ OVERLAY HASIL SCAN ============ -->
  <div id="hasilOverlay" class="hasil-overlay">
    <canvas id="confettiCanvas"></canvas>
    <div class="hasil-card" id="hasilCard">
      <!-- diisi via JS -->
    </div>
  </div>

  <!-- Library QR Generator -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <!-- Library QR Scanner -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <script>
    /* ============ STATE ============ */
    let dataSekolah = [];
    let editIndex = -1;

    let scannerHadir = null;
    let scannerSelesai = null;
    let aktifHadir = false;
    let aktifSelesai = false;

    /* ============ ELEMEN ============ */
    const form = document.getElementById('formSekolah');
    const inputNama = document.getElementById('nama');
    const inputAlamat = document.getElementById('alamat');
    const inputKodeQR = document.getElementById('kodeqr');
    const daftarSekolah = document.getElementById('daftarSekolah');
    const formTitle = document.getElementById('formTitle');
    const btnSubmit = document.getElementById('btnSubmit');
    const btnCancel = document.getElementById('btnCancel');
    const errorHadir = document.getElementById('errorHadir');
    const errorSelesai = document.getElementById('errorSelesai');
    const hasilOverlay = document.getElementById('hasilOverlay');
    const hasilCard = document.getElementById('hasilCard');
    const confettiCanvas = document.getElementById('confettiCanvas');

    /* ============ NAVIGASI ============ */
    function showPage(nama) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));

      hentikanHadir();
      hentikanSelesai();
      errorHadir.classList.remove('show');
      errorSelesai.classList.remove('show');

      if (nama === 'daftar') {
        document.getElementById('pageDaftar').classList.add('active');
        document.getElementById('navDaftar').classList.add('active');
      } else if (nama === 'hadir') {
        document.getElementById('pageHadir').classList.add('active');
        document.getElementById('navHadir').classList.add('active');
        setTimeout(mulaiHadir, 300);
      } else if (nama === 'selesai') {
        document.getElementById('pageSelesai').classList.add('active');
        document.getElementById('navSelesai').classList.add('active');
        setTimeout(mulaiSelesai, 300);
      }
    }

    /* ============ FORM ============ */
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const nama = inputNama.value.trim();
      const alamat = inputAlamat.value.trim();
      const kodeqr = inputKodeQR.value.trim();
      if (!nama || !alamat || !kodeqr) return;

      const duplikat = dataSekolah.some((s, i) =>
        s.kodeqr.toLowerCase() === kodeqr.toLowerCase() && i !== editIndex
      );
      if (duplikat) { alert('Kode QR sudah digunakan!'); return; }

      const dataBaru = { nama, alamat, kodeqr };
      if (editIndex === -1) dataSekolah.push(dataBaru);
      else { dataSekolah[editIndex] = dataBaru; resetModeEdit(); }

      renderDaftar();
      form.reset();
      inputNama.focus();
    });

    btnCancel.addEventListener('click', function () {
      resetModeEdit();
      form.reset();
      inputNama.focus();
    });

    function resetModeEdit() {
      editIndex = -1;
      formTitle.textContent = 'Form Pendaftaran Sekolah';
      btnSubmit.textContent = 'Tambah ke Daftar';
      btnCancel.style.display = 'none';
    }

    /* ============ RENDER DAFTAR ============ */
    function renderDaftar() {
      daftarSekolah.innerHTML = '';
      if (dataSekolah.length === 0) {
        daftarSekolah.innerHTML = '<p class="empty">Belum ada data sekolah.</p>';
        return;
      }

      dataSekolah.forEach((item, index) => {
        const itemEl = document.createElement('div');
        itemEl.className = 'sekolah-item';

        const info = document.createElement('div');
        info.className = 'sekolah-info';
        info.innerHTML = `
          <p><strong>Nama:</strong> ${escapeHtml(item.nama)}</p>
          <p><strong>Alamat:</strong> ${escapeHtml(item.alamat)}</p>
          <p><strong>Kode QR:</strong> ${escapeHtml(item.kodeqr)}</p>
        `;

        const qrBox = document.createElement('div');
        qrBox.className = 'qr-box';
        new QRCode(qrBox, {
          text: item.kodeqr, width: 80, height: 80,
          colorDark: "#000000", colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });

        const aksi = document.createElement('div');
        aksi.className = 'aksi';

        const btnEdit = document.createElement('button');
        btnEdit.textContent = 'Edit';
        btnEdit.className = 'btn-edit';
        btnEdit.onclick = () => mulaiEdit(index);

        const btnHapus = document.createElement('button');
        btnHapus.textContent = 'Hapus';
        btnHapus.className = 'btn-hapus';
        btnHapus.onclick = () => hapusItem(index);

        aksi.appendChild(btnEdit);
        aksi.appendChild(btnHapus);

        itemEl.appendChild(info);
        itemEl.appendChild(qrBox);
        itemEl.appendChild(aksi);
        daftarSekolah.appendChild(itemEl);
      });
    }

    function mulaiEdit(index) {
      const item = dataSekolah[index];
      inputNama.value = item.nama;
      inputAlamat.value = item.alamat;
      inputKodeQR.value = item.kodeqr;

      editIndex = index;
      formTitle.textContent = 'Edit Data Sekolah';
      btnSubmit.textContent = 'Simpan Perubahan';
      btnCancel.style.display = 'block';
      showPage('daftar');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      inputNama.focus();
    }

    function hapusItem(index) {
      if (!confirm('Yakin ingin menghapus data ini?')) return;
      dataSekolah.splice(index, 1);
      if (editIndex === index) { resetModeEdit(); form.reset(); }
      else if (editIndex > index) editIndex--;
      renderDaftar();
    }

    /* ============ SCANNER KEHADIRAN ============ */
    function mulaiHadir() {
      if (aktifHadir) return;
      const readerDiv = document.getElementById('readerHadir');
      readerDiv.innerHTML = '<div class="loading-text">Memuat kamera...</div>';
      scannerHadir = new Html5Qrcode("readerHadir");

      Html5Qrcode.getCameras().then(cameras => {
        if (!cameras || cameras.length === 0) {
          tampilkanError(errorHadir, 'Kamera tidak ditemukan.');
          return;
        }
        const kamera = cameras.find(c =>
          c.label.toLowerCase().includes('back') ||
          c.label.toLowerCase().includes('rear') ||
          c.label.toLowerCase().includes('environment')
        ) || cameras[cameras.length - 1];

        readerDiv.innerHTML = '';
        scannerHadir.start(
          kamera.id,
          { fps: 10, qrbox: { width: 250, height: 250 } },
          onHadirScanSuccess, () => {}
        ).then(() => { aktifHadir = true; errorHadir.classList.remove('show'); })
         .catch(err => tampilkanError(errorHadir, 'Gagal memulai kamera: ' + err.message));
      }).catch(err => {
        tampilkanError(errorHadir, 'Tidak bisa akses kamera. Pastikan HTTPS/localhost & izin diberikan.');
        console.error(err);
      });
    }

    function hentikanHadir() {
      if (scannerHadir && aktifHadir) {
        scannerHadir.stop().then(() => { scannerHadir.clear(); aktifHadir = false; }).catch(() => {});
      }
    }

    function onHadirScanSuccess(decodedText) {
      const sekolah = cariSekolah(decodedText);
      if (navigator.vibrate) navigator.vibrate([200, 80, 200, 80, 400]);
      hentikanHadir();
      tampilkanOverlay('hadir', sekolah, decodedText);
    }

    /* ============ SCANNER SELESAI ============ */
    function mulaiSelesai() {
      if (aktifSelesai) return;
      const readerDiv = document.getElementById('readerSelesai');
      readerDiv.innerHTML = '<div class="loading-text">Memuat kamera...</div>';
      scannerSelesai = new Html5Qrcode("readerSelesai");

      Html5Qrcode.getCameras().then(cameras => {
        if (!cameras || cameras.length === 0) {
          tampilkanError(errorSelesai, 'Kamera tidak ditemukan.');
          return;
        }
        const kamera = cameras.find(c =>
          c.label.toLowerCase().includes('back') ||
          c.label.toLowerCase().includes('rear') ||
          c.label.toLowerCase().includes('environment')
        ) || cameras[cameras.length - 1];

        readerDiv.innerHTML = '';
        scannerSelesai.start(
          kamera.id,
          { fps: 10, qrbox: { width: 250, height: 250 } },
          onSelesaiScanSuccess, () => {}
        ).then(() => { aktifSelesai = true; errorSelesai.classList.remove('show'); })
         .catch(err => tampilkanError(errorSelesai, 'Gagal memulai kamera: ' + err.message));
      }).catch(err => {
        tampilkanError(errorSelesai, 'Tidak bisa akses kamera. Pastikan HTTPS/localhost & izin diberikan.');
        console.error(err);
      });
    }

    function hentikanSelesai() {
      if (scannerSelesai && aktifSelesai) {
        scannerSelesai.stop().then(() => { scannerSelesai.clear(); aktifSelesai = false; }).catch(() => {});
      }
    }

    function onSelesaiScanSuccess(decodedText) {
      const sekolah = cariSekolah(decodedText);
      if (navigator.vibrate) navigator.vibrate([400, 100, 400, 100, 600]);
      hentikanSelesai();
      tampilkanOverlay('selesai', sekolah, decodedText);
    }

    /* ============ OVERLAY HASIL + ANIMASI ============ */
    function tampilkanOverlay(tipe, sekolah, kodeTerdeteksi) {
      hasilOverlay.className = 'hasil-overlay show ' + (sekolah ? tipe : 'tidak-dikenal');

      let html = '';

      if (sekolah) {
        if (tipe === 'hadir') {
          html = `
            <div class="status-badge anim-line line-1">✓</div>
            <div class="status-text">HADIR</div>
            <div class="sambutan anim-line line-2">
              Perwakilan dari
            </div>
            <div class="sekolah-nama anim-line line-3">
              🏫 ${escapeHtml(sekolah.nama)}
            </div>
            <div class="sekolah-alamat anim-line line-3">
              📍 ${escapeHtml(sekolah.alamat)}
            </div>
            <div class="sambutan anim-line line-4">
              <span class="highlight">Selamat datang di MTs Salafiyah</span>
            </div>
            <div class="pesan anim-line line-5">
              Semoga menyenangkan ✨
            </div>
            <div class="emoji-row anim-line line-5">
              <span>🎉</span><span>🎊</span><span>🌟</span><span>🎈</span><span>✨</span>
            </div>
            <div class="timestamp anim-line line-5">
              ${new Date().toLocaleString('id-ID')}
            </div>
            <button class="btn-scan-ulang" onclick="tutupOverlay('hadir')">Scan Lagi</button>
          `;
        } else {
          html = `
            <div class="status-badge anim-line line-1">✅</div>
            <div class="status-text">SELESAI</div>
            <div class="sambutan anim-line line-2">
              <span class="highlight">Terima kasih</span>
            </div>
            <div class="sambutan anim-line line-3">
              perwakilan dari
            </div>
            <div class="sekolah-nama anim-line line-3">
              🏫 ${escapeHtml(sekolah.nama)}
            </div>
            <div class="sekolah-alamat anim-line line-3">
              📍 ${escapeHtml(sekolah.alamat)}
            </div>
            <div class="pesan anim-line line-4">
              atas partisipasinya,<br>
              semoga ilmunya bermanfaat 🙏
            </div>
            <div class="emoji-row anim-line line-5">
              <span>🙏</span><span>💐</span><span>🌟</span><span>💖</span><span>📚</span>
            </div>
            <div class="timestamp anim-line line-5">
              ${new Date().toLocaleString('id-ID')}
            </div>
            <button class="btn-scan-ulang" onclick="tutupOverlay('selesai')">Scan Lagi</button>
          `;
        }
      } else {
        html = `
          <div class="status-badge anim-line line-1">❌</div>
          <div class="status-text">TIDAK DIKENAL</div>
          <div class="pesan anim-line line-2">
            Kode QR tidak terdaftar:
          </div>
          <div class="sekolah-nama anim-line line-3">
            ${escapeHtml(kodeTerdeteksi)}
          </div>
          <button class="btn-scan-ulang" onclick="tutupOverlay('${tipe}')">Scan Lagi</button>
        `;
      }

      hasilCard.innerHTML = html;

      // Start confetti
      if (sekolah) {
        startConfetti(tipe === 'hadir'
          ? ['#ffd54f', '#66bb6a', '#ffffff', '#ffb300', '#81c784']
          : ['#64b5f6', '#ffffff', '#1565c0', '#ffd54f', '#90caf9']
        );
      }
    }

    function tutupOverlay(tipe) {
      hasilOverlay.classList.remove('show');
      stopConfetti();
      setTimeout(() => {
        if (tipe === 'hadir') mulaiHadir();
        else if (tipe === 'selesai') mulaiSelesai();
      }, 250);
    }

    /* ============ CONFETTI ============ */
    let confettiAnim = null;
    let particles = [];
    let confettiColors = [];

    function startConfetti(colors) {
      confettiColors = colors;
      const ctx = confettiCanvas.getContext('2d');
      const resize = () => {
        confettiCanvas.width = window.innerWidth;
        confettiCanvas.height = window.innerHeight;
      };
      resize();
      window.addEventListener('resize', resize);

      particles = [];
      for (let i = 0; i < 180; i++) {
        particles.push({
          x: Math.random() * confettiCanvas.width,
          y: Math.random() * -confettiCanvas.height,
          r: Math.random() * 8 + 4,
          dx: (Math.random() - 0.5) * 4,
          dy: Math.random() * 4 + 2,
          rot: Math.random() * Math.PI,
          rotSpeed: (Math.random() - 0.5) * 0.2,
          color: colors[Math.floor(Math.random() * colors.length)],
          shape: Math.random() > 0.5 ? 'rect' : 'circle'
        });
      }

      function draw() {
        ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        particles.forEach(p => {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          if (p.shape === 'rect') {
            ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 1.6);
          } else {
            ctx.beginPath();
            ctx.arc(0, 0, p.r / 2, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();

          p.x += p.dx;
          p.y += p.dy;
          p.rot += p.rotSpeed;

          if (p.y > confettiCanvas.height + 20) {
            p.y = -20;
            p.x = Math.random() * confettiCanvas.width;
          }
        });
        confettiAnim = requestAnimationFrame(draw);
      }
      draw();
    }

    function stopConfetti() {
      if (confettiAnim) {
        cancelAnimationFrame(confettiAnim);
        confettiAnim = null;
      }
      const ctx = confettiCanvas.getContext('2d');
      ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    }

    /* ============ UTIL ============ */
    function cariSekolah(kode) {
      return dataSekolah.find(s => s.kodeqr.toLowerCase() === kode.trim().toLowerCase());
    }

    function tampilkanError(el, pesan) {
      el.textContent = pesan;
      el.classList.add('show');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
